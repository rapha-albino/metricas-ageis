<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1062 461" role="img" aria-labelledby="title desc"><title id="title">Diagrama de fluxo acumulado do caso da plataforma B2B</title><desc id="desc">Redesenho editorial do caso apresentado no livro. Seis linhas mostram as etapas Em desenvolvimento, Revisão de código, Aguardando testes, Em testes, Em homologação e Finalizado ao longo de vinte semanas. As linhas convergem quando o fluxo é estabilizado.</desc><rect width="1062" height="461" fill="#fff"/><g font-family="Arial, sans-serif" fill="#14212B"><text x="105" y="43" font-size="27" font-weight="700">Fluxo acumulado do caso B2B</text><text x="105" y="68" font-size="15" fill="#46586A">Redesenho editorial das etapas acompanhadas no capítulo sobre CFD</text></g><g stroke="#D6E0E3" stroke-width="1"><line x1="105" y1="105" x2="865" y2="105"/><line x1="105" y1="165" x2="865" y2="165"/><line x1="105" y1="225" x2="865" y2="225"/><line x1="105" y1="285" x2="865" y2="285"/><line x1="105" y1="345" x2="865" y2="345"/><line x1="105" y1="105" x2="105" y2="345"/><line x1="185" y1="105" x2="185" y2="345"/><line x1="265" y1="105" x2="265" y2="345"/><line x1="345" y1="105" x2="345" y2="345"/><line x1="425" y1="105" x2="425" y2="345"/><line x1="505" y1="105" x2="505" y2="345"/><line x1="585" y1="105" x2="585" y2="345"/><line x1="665" y1="105" x2="665" y2="345"/><line x1="745" y1="105" x2="745" y2="345"/><line x1="825" y1="105" x2="825" y2="345"/></g><g font-family="Arial, sans-serif" font-size="14" fill="#46586A"><text x="92" y="350">0</text><text x="84" y="290">10</text><text x="84" y="230">20</text><text x="84" y="170">30</text><text x="84" y="110">40</text><text x="24" y="275" transform="rotate(-90 24 275)" font-style="italic">Itens acumulados</text><text x="454" y="413" font-size="17" font-style="italic">Semanas</text><text x="101" y="380">1</text><text x="178" y="380">3</text><text x="258" y="380">5</text><text x="338" y="380">7</text><text x="418" y="380">9</text><text x="495" y="380">11</text><text x="575" y="380">13</text><text x="655" y="380">15</text><text x="735" y="380">17</text><text x="815" y="380">20</text></g><g fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="105,333 185,294 265,270 345,246 425,222 505,204 585,180 665,150 745,126 825,105" stroke="#4A545A" stroke-width="5"/><polyline points="105,339 185,306 265,282 345,258 425,234 505,216 585,192 665,162 745,132 825,105" stroke="#667177" stroke-width="5" stroke-dasharray="14 7"/><polyline points="105,342 185,318 265,294 345,270 425,246 505,228 585,204 665,174 745,144 825,105" stroke="#818A8F" stroke-width="5"/><polyline points="105,345 185,324 265,306 345,282 425,258 505,240 585,216 665,186 745,150 825,105" stroke="#9AA2A6" stroke-width="5" stroke-dasharray="8 8"/><polyline points="105,345 185,333 265,318 345,294 425,270 505,252 585,228 665,198 745,162 825,105" stroke="#B0B7BA" stroke-width="5"/><polyline points="105,345 185,339 265,330 345,318 425,300 505,282 585,252 665,216 745,174 825,105" stroke="#14212B" stroke-width="6"/></g><g font-family="Arial, sans-serif" font-size="15" font-weight="700"><text x="880" y="122" fill="#4A545A">Em desenvolvimento</text><text x="880" y="150" fill="#667177">Revisão de código</text><text x="880" y="178" fill="#818A8F">Aguardando testes</text><text x="880" y="206" fill="#667177">Em testes</text><text x="880" y="234" fill="#667177">Em homologação</text><text x="880" y="262" fill="#14212B">Finalizado</text></g><g stroke="#1C5C70" stroke-width="2" fill="none"><path d="M490 97L535 172"/><path d="M535 172l-9-13m9 13l-15-4"/></g><text x="397" y="92" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#1C5C70">Limite de trabalho em progresso</text><text x="105" y="438" font-family="Arial, sans-serif" font-size="12" fill="#46586A">As linhas representam as etapas do caso; o gráfico é um redesenho editorial para leitura em tela.</text></svg>