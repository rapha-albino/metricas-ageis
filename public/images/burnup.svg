<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1071 435" role="img" aria-labelledby="title desc"><title id="title">Gráfico de burnup</title><desc id="desc">A linha preta de trabalho concluído cresce ao longo das semanas e a linha cinza de trabalho a ser feito diminui. O objetivo é que as duas se encontrem.</desc><rect width="1071" height="435" fill="#fff"/><g font-family="Arial, sans-serif" fill="#14212B"><text x="130" y="35" font-size="27" font-weight="700">Gráfico de burnup</text><line x1="130" y1="56" x2="170" y2="56" stroke="#111" stroke-width="4"/><text x="178" y="63" font-size="20">Trabalho concluído</text><line x1="378" y1="56" x2="418" y2="56" stroke="#aeb4b7" stroke-width="4"/><text x="426" y="63" font-size="20">Trabalho a ser feito</text></g><g stroke="#c7d0d4"><line x1="130" y1="80" x2="1055" y2="80"/><line x1="130" y1="123" x2="1055" y2="123"/><line x1="130" y1="167" x2="1055" y2="167"/><line x1="130" y1="210" x2="1055" y2="210"/><line x1="130" y1="253" x2="1055" y2="253"/><line x1="130" y1="296" x2="1055" y2="296"/><line x1="130" y1="340" x2="1055" y2="340"/><line x1="130" y1="80" x2="130" y2="340"/><line x1="361" y1="80" x2="361" y2="340"/><line x1="593" y1="80" x2="593" y2="340"/><line x1="824" y1="80" x2="824" y2="340"/><line x1="1055" y1="80" x2="1055" y2="340"/></g><g font-family="Arial, sans-serif" font-size="15" fill="#14212B"><text x="96" y="86">54</text><text x="96" y="129">48</text><text x="96" y="173">42</text><text x="96" y="216">36</text><text x="96" y="259">24</text><text x="96" y="302">12</text><text x="105" y="346">0</text><text x="32" y="245" transform="rotate(-90 32 245)" font-size="19" font-style="italic">Número de demandas</text><text x="552" y="425" font-size="18" font-style="italic">Semanas</text></g><polyline points="130,99 245,117 303,108 361,128 535,128" fill="none" stroke="#aeb4b7" stroke-width="4"/><polyline points="130,340 245,321 303,316 361,301 419,282 477,253 535,230" fill="none" stroke="#111" stroke-width="4"/><text x="430" y="184" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14212B">O objetivo é que as duas linhas se</text><text x="400" y="218" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#14212B">encontrem em algum momento do tempo</text><g font-family="Arial, sans-serif" font-size="15" fill="#14212B"><text x="126" y="364">0</text><text x="357" y="364">4</text><text x="589" y="364">8</text><text x="820" y="364">12</text><text x="1048" y="364">16</text></g></svg>